name: Build desktop apps

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: lantern-linux
            bundles: deb,appimage
          - runner: windows-latest
            artifact: lantern-windows
            bundles: nsis
          - runner: macos-latest
            artifact: lantern-macos
            bundles: dmg
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 23
          sudo apt-get install --yes \
            build-essential \
            clang-23 \
            curl \
            file \
            libfuse2 \
            wget \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            librsvg2-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Select Linux C++ compiler
        if: runner.os == 'Linux'
        run: echo "CXX=clang++-23" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure macOS WebRTC runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          runtime_archive="$(xcrun clang --print-resource-dir)/lib/darwin/libclang_rt.osx.a"
          test -f "$runtime_archive"
          echo "CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS=-C link-arg=$runtime_archive" >> "$GITHUB_ENV"

      - name: Build and bundle Lantern
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 14
